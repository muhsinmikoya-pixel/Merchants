<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account — MERCHANT</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#10111c;color:#f7f6fc;font-family:'DM Sans',sans-serif}.wrap{width:min(900px,calc(100% - 30px));margin:auto}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff16}.brand{font:800 14px Manrope;letter-spacing:.14em}.nav button{border:1px solid #ffffff22;background:#ffffff0a;color:white;padding:9px 13px;border-radius:9px}.hero{padding:38px 0 20px}.hero h1{font:800 34px Manrope;margin:0 0 7px}.muted{color:#aaa9bd;font-size:13px}.card{background:#191a29;border:1px solid #ffffff16;border-radius:15px;padding:19px;margin:13px 0}.order{padding:14px 0;border-bottom:1px solid #ffffff12}.order:last-child{border:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.status{font-size:10px;padding:6px 9px;background:#ffffff12;border-radius:20px}.items{font-size:12px;color:#aaa9bd;line-height:1.8;margin-top:9px}.empty{text-align:center;padding:40px;color:#aaa9bd}.btn{display:inline-block;background:linear-gradient(110deg,#ad91ff,#72b5ff);padding:11px 15px;border-radius:10px;color:#151424;text-decoration:none;font-weight:800;font-size:12px}</style></head><body><header class="wrap nav"><a class="brand" href="index.html">✦ MERCHANT</a><button id="logout">Log out</button></header><main class="wrap"><section class="hero"><h1>Your orders.</h1><p class="muted" id="welcome">Your shopping activity in one place.</p></section><section class="card"><div class="row"><h2 style="font:700 17px Manrope;margin:0">Order history</h2><a class="btn" href="stores.html">Explore stores</a></div><div id="orders"><div class="empty">Loading your orders...</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script type="module">import{supabase,money,escapeHTML}from'./js/supabase.js';const{data:{session}}=await supabase.auth.getSession();if(!session)location.replace('auth.html?role=customer');else{const{data:p}=await supabase.from('profiles').select('role,full_name').eq('id',session.user.id).single();if(p?.role==='seller')location.replace('dashboard.html');document.getElementById('welcome').textContent='Welcome'+(p?.full_name?' back, '+p.full_name:'')+'. Here are your orders.';const{data:orders,error}=await supabase.from('orders').select('id,customer_name,total_amount,status,created_at,store_id,stores(name,slug),order_items(product_name,quantity,unit_price)').eq('customer_id',session.user.id).order('created_at',{ascending:false});const el=document.getElementById('orders');if(error)el.textContent=error.message;else el.innerHTML=(orders||[]).map(o=>'<article class="order"><div class="row"><b>#'+o.id.slice(0,8)+' · '+escapeHTML(o.stores?.name||'Store')+'</b><span class="status">'+escapeHTML(o.status)+'</span></div><div class="row" style="margin-top:8px"><span class="muted">'+new Date(o.created_at).toLocaleString()+'</span><b>'+money(o.total_amount)+'</b></div><div class="items">'+(o.order_items||[]).map(i=>escapeHTML(i.product_name)+' × '+i.quantity+' — '+money(i.unit_price*i.quantity)).join('<br>')+'</div></article>').join('')||'<div class="empty">You have not placed any orders yet. <br><br><a class="btn" href="stores.html">Find a store</a></div>'}document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.replace('index.html')};</script></body></html>
