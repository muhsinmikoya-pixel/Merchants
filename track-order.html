<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111b"><title>Track an order — MERCHANT</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#10111b;color:#f7f6fc;font-family:'DM Sans',sans-serif}.wrap{width:min(620px,calc(100% - 30px));margin:auto}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font:800 14px Manrope;letter-spacing:.14em;color:#fff;text-decoration:none}.nav a:last-child{color:#cbb77c;font-size:12px}.card{margin:45px 0;background:#191a29;border:1px solid #ffffff18;border-radius:18px;padding:25px}.card h1{font:800 29px Manrope;margin:0 0 8px}.muted{color:#aaa9bd;font-size:13px;line-height:1.6}.field{margin:16px 0}.field label{display:block;font-size:12px;margin-bottom:7px;color:#d5d1df}.field input{width:100%;padding:14px;border:1px solid #ffffff22;border-radius:10px;background:#10111b;color:white;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(110deg,#d5b66a,#f0d994);font-weight:800;color:#17151b}.result{margin-top:20px;padding:16px;border:1px solid #ffffff18;border-radius:12px;display:none}.result.show{display:block}.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff12;font-size:13px}.status{display:inline-block;border-radius:30px;padding:6px 10px;background:#ffffff13;font-size:11px}.error{color:#ffb6bd}</style><link rel="stylesheet" href="merchant.css">
</head><body><header class="wrap nav"><a class="brand" href="index.html">MERCHANT</a><a href="stores.html">Explore stores</a></header><main class="wrap"><section class="card"><h1>Track your order.</h1><p class="muted">Enter the order number and the phone number you used at checkout. This works for guest orders.</p><form id="form"><div class="field"><label for="orderId">Order number</label><input id="orderId" required placeholder="Paste your full order number"></div><div class="field"><label for="phone">Checkout phone number</label><input id="phone" required inputmode="tel" placeholder="The same number used at checkout"></div><button class="btn" id="submit">Find my order</button></form><div id="result" class="result"></div><p id="message" class="muted"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script type="module">import{supabase,money,escapeHTML}from'./js/supabase.js';const $=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='Checking...';$('result').classList.remove('show');$('message').textContent='';try{const{data,error}=await supabase.rpc('track_merchant_guest_order',{p_order_id:$('orderId').value.trim(),p_phone:$('phone').value.trim()});if(error)throw error;const items=Array.isArray(data.items)?data.items:[];$('result').innerHTML='<div class="line"><b>Order</b><span>#'+escapeHTML(data.id.slice(0,8))+'</span></div><div class="line"><b>Store</b><span>'+escapeHTML(data.store_name)+'</span></div><div class="line"><b>Status</b><span class="status">'+escapeHTML(data.status)+'</span></div><div class="line"><b>Order total</b><b>'+money(data.total_amount)+'</b></div><div class="line"><b>Placed</b><span>'+new Date(data.created_at).toLocaleString()+'</span></div><h3>Items</h3>'+items.map(i=>'<div class="line"><span>'+escapeHTML(i.name)+' × '+i.quantity+'</span><b>'+money(i.line_total)+'</b></div>').join('');$('result').classList.add('show')}catch(err){$('message').textContent=err.message||'Could not find that order.';$('message').classList.add('error')}finally{$('submit').disabled=false;$('submit').textContent='Find my order'}};</script></body></html>
