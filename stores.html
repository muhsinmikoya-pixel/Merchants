<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover stores — MERCHANT</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#10111c;color:#f7f6fc;font-family:'DM Sans',sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.nav{min-height:75px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #ffffff16}.nav>a{white-space:nowrap}.cover.sunset span{color:#57351f;text-shadow:none}.card{transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);border-color:#ffffff35;box-shadow:0 16px 40px #0003}.cover img{object-fit:contain}.brand{font:800 14px Manrope;letter-spacing:.14em}.nav a{color:#c7c4d7;text-decoration:none;font-size:12px}.hero{padding:45px 0 22px}.hero h1{font:800 clamp(32px,5vw,48px) Manrope;letter-spacing:-.05em;margin:0 0 10px}.hero p{color:#aaa9bd;font-size:14px}.search{width:100%;padding:15px;border:1px solid #ffffff20;background:#191a29;border-radius:12px;color:white;font:inherit;margin:14px 0 25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #ffffff16;border-radius:17px;overflow:hidden;background:#191a29}.cover{height:155px;background:linear-gradient(135deg,#bba5ff,#536a9e);display:flex;align-items:flex-end;padding:16px}.cover.sunset{background:linear-gradient(135deg,#fffaf4,#ffe0c2 48%,#f58b42)}.cover.luxury{background:linear-gradient(135deg,#c6a45b,#171717 55%,#050505)}.cover.colorful{background:linear-gradient(135deg,#9c78ed,#ef9bc4)}.cover.galaxy{background:radial-gradient(2px 2px at 20% 30%,#fff 99%,transparent),radial-gradient(2px 2px at 70% 22%,#fff 99%,transparent),linear-gradient(135deg,#050611,#191b38)}.cover.emerald{background:linear-gradient(135deg,#092c20,#16704b,#74bd8f)}.cover span{font:800 24px Manrope;color:#fff;text-shadow:0 2px 10px #0005}.cover img{width:62px;height:62px;object-fit:cover;border-radius:16px;background:#fff;padding:4px;margin-right:12px}.store-symbol{width:52px;height:52px;border-radius:15px;background:#ffffff22;display:grid;place-items:center;margin-right:12px}.cover.galaxy{background:radial-gradient(2px 2px at 20% 30%,#fff 99%,transparent),radial-gradient(2px 2px at 70% 22%,#fff 99%,transparent),linear-gradient(135deg,#050611,#191b38)}.cover.emerald{background:linear-gradient(135deg,#092c20,#16704b,#74bd8f)}.body{padding:15px}.body h2{font:700 16px Manrope;margin:0 0 6px}.body p{font-size:12px;color:#aaa9bd;line-height:1.6;min-height:38px}.body a{display:block;text-align:center;padding:11px;border-radius:10px;background:linear-gradient(110deg,#ad91ff,#72b5ff);color:#151424;text-decoration:none;font-size:12px;font-weight:800}.empty{color:#aaa9bd;text-align:center;padding:50px 10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="merchant.css">
</head><body><header class="wrap nav"><a class="brand" href="index.html">✦ MERCHANT</a><a id="accountLink" href="auth.html?role=customer">Sign in</a><a href="auth.html?role=seller">Sell on MERCHANT</a><a href="track-order.html">Track an order</a></header><main class="wrap"><section class="hero"><h1>Find your next favourite.</h1><p>Explore independent stores and discover something new.</p><input class="search" id="search" placeholder="Search stores by name or what they sell..."></section><section class="grid" id="storeGrid"><div class="empty">Loading stores...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script src="https://unpkg.com/lucide@latest"></script><script type="module">import{supabase,escapeHTML}from'./js/supabase.js';let stores=[];const grid=document.getElementById('storeGrid');function render(){const q=document.getElementById('search').value.toLowerCase();const list=stores.filter(s=>(s.name+' '+s.description).toLowerCase().includes(q));grid.innerHTML=list.map(s=>'<article class="card"><div class="cover '+(s.theme==='luxury'?'luxury':s.theme==='colorful'?'colorful':s.theme==='sunset'?'sunset':s.theme==='galaxy'?'galaxy':s.theme==='emerald'?'emerald':'')+'">'+(s.logo_url?'<img src="'+escapeHTML(s.logo_url)+'" alt="" loading="lazy">':'<span class="store-symbol"><i data-lucide="store"></i></span>')+'<span>'+escapeHTML(s.name)+'</span></div><div class="body"><h2>'+escapeHTML(s.name)+'</h2><p>'+escapeHTML(s.description||'Discover this independent store on MERCHANT.')+'</p><a href="shop.html?store='+encodeURIComponent(s.slug)+'">Visit store ↗</a></div></article>').join('')||'<div class="empty">No stores found. Try another search.</div>'}const{data:{session}}=await supabase.auth.getSession();if(session){const{data:profile}=await supabase.from('profiles').select('role').eq('id',session.user.id).maybeSingle();const link=document.getElementById('accountLink');link.textContent=profile?.role==='seller'?'Seller studio':'My account';link.href=profile?.role==='seller'?'dashboard.html':'account.html'}const{data,error}=await supabase.from('stores').select('id,name,slug,description,theme,logo_url').eq('is_published',true).order('created_at',{ascending:false});if(error)grid.innerHTML='<div class="empty">Could not load stores: '+escapeHTML(error.message)+'</div>';else{stores=data||[];render()}document.getElementById('search').oninput=render;if(window.lucide)window.lucide.createIcons();</script></body></html>
