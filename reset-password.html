<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — MERCHANT</title><style>body{margin:0;background:#11111d;color:#fff;font:15px Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(420px,100%);background:#1b1b2b;border:1px solid #ffffff20;border-radius:18px;padding:25px}input,button{width:100%;padding:14px;border-radius:9px;margin:9px 0;border:1px solid #ffffff25;background:#11111d;color:white}button{background:linear-gradient(110deg,#ad91ff,#72b5ff);color:#111;font-weight:bold;border:0}p{color:#aaa;line-height:1.6}</style></head><body><div class="box"><h2>Choose a new password</h2><p>Enter a new password for your MERCHANT account.</p><form id="form"><input id="password" type="password" minlength="8" required placeholder="New password"><input id="confirm" type="password" minlength="8" required placeholder="Confirm new password"><button>Update password</button></form><p id="msg"></p><a href="auth.html" style="color:#c7b7ff">Back to sign in</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script type="module">import{supabase}from'./js/supabase.js';const{data:{session}}=await supabase.auth.getSession();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value){document.getElementById('msg').textContent='Passwords do not match.';return}const{error}=await supabase.auth.updateUser({password:p});document.getElementById('msg').textContent=error?error.message:'Password updated. You can now sign in.';if(!error)setTimeout(()=>location.href='auth.html',1800)};</script></body></html>
